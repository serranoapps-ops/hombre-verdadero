<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hombre Verdadero — Seguimiento de Lectura</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink:        #1a1612;
    --parchment:  #f7f3ec;
    --warm-mid:   #e8e0d0;
    --gold:       #8b6914;
    --gold-light: #c9972a;
    --stone:      #6b6258;
    --ember:      #7a2d1e;
    --leaf:       #2d5a27;
    --completed:  #e8f0e7;
    --radius:     6px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--parchment);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    color: var(--parchment);
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 39px,
      rgba(255,255,255,0.03) 40px
    );
    pointer-events: none;
  }
  header .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold-light);
    margin-bottom: 0.6rem;
  }
  header h1 {
    font-family: 'EB Garamond', serif;
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  header .subtitle {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: rgba(247,243,236,0.65);
    margin-top: 0.4rem;
  }
  header .meta {
    margin-top: 1rem;
    font-size: 12px;
    color: rgba(247,243,236,0.4);
    letter-spacing: 0.05em;
  }

  /* ── PROGRESS BANNER ── */
  .progress-bar-wrap {
    background: var(--ink);
    padding: 0 1.5rem 1.2rem;
    text-align: center;
  }
  .progress-track {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 12px;
    color: rgba(247,243,236,0.5);
  }
  .progress-fill-outer {
    width: 160px;
    height: 4px;
    background: rgba(255,255,255,0.12);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill-inner {
    height: 100%;
    background: var(--gold-light);
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  #progress-label { color: var(--gold-light); font-weight: 600; }

  /* ── NAV ── */
  nav {
    display: flex;
    gap: 0.3rem;
    padding: 0.75rem 1.5rem;
    background: white;
    border-bottom: 1px solid var(--warm-mid);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  nav::-webkit-scrollbar { display: none; }
  nav .nav-pill {
    flex-shrink: 0;
    padding: 0.3rem 0.75rem;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid var(--warm-mid);
    background: transparent;
    color: var(--stone);
    transition: all 0.18s;
    white-space: nowrap;
  }
  nav .nav-pill:hover { border-color: var(--gold); color: var(--gold); }
  nav .nav-pill.active { background: var(--ink); color: var(--parchment); border-color: var(--ink); }
  nav .nav-pill.done { border-color: var(--leaf); color: var(--leaf); }
  nav .nav-pill.done.active { background: var(--leaf); color: white; }

  /* ── CHAPTER LIST ── */
  main { padding: 1.5rem; max-width: 760px; margin: 0 auto; }

  .chapter-card {
    background: white;
    border: 1px solid var(--warm-mid);
    border-radius: var(--radius);
    margin-bottom: 1rem;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .chapter-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  .chapter-card.completed { border-color: #b8d4b5; }
  .chapter-card.completed .chapter-header { background: var(--completed); }

  .chapter-header {
    display: flex;
    align-items: flex-start;
    gap: 0.9rem;
    padding: 1rem 1.1rem;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .chapter-header:hover { background: #fafafa; }
  .chapter-card.completed .chapter-header:hover { background: #deeadc; }

  .ch-num {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    background: var(--ink);
    color: var(--parchment);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }
  .chapter-card.completed .ch-num { background: var(--leaf); }

  .ch-info { flex: 1; min-width: 0; }
  .ch-tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 2px;
  }
  .ch-title {
    font-family: 'EB Garamond', serif;
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.25;
    color: var(--ink);
  }
  .ch-sub {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 0.9rem;
    color: var(--stone);
    margin-top: 1px;
  }
  .ch-author { font-size: 11px; color: var(--stone); margin-top: 4px; }

  .ch-toggle {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    margin-top: 2px;
  }
  .ch-status-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--stone);
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid var(--warm-mid);
    background: var(--parchment);
  }
  .chapter-card.completed .ch-status-badge {
    color: var(--leaf);
    border-color: #b8d4b5;
    background: #f0f7ef;
  }
  .ch-arrow {
    font-size: 16px;
    color: var(--stone);
    transition: transform 0.25s;
    line-height: 1;
  }
  .chapter-card.open .ch-arrow { transform: rotate(180deg); }

  /* ── CHAPTER BODY ── */
  .chapter-body {
    display: none;
    padding: 0 1.1rem 1.2rem;
    border-top: 1px solid var(--warm-mid);
  }
  .chapter-card.open .chapter-body { display: block; }

  /* Tabs */
  .tab-row {
    display: flex;
    gap: 0.25rem;
    padding: 0.75rem 0 0.6rem;
    border-bottom: 1px solid var(--warm-mid);
    margin-bottom: 1rem;
  }
  .tab-btn {
    padding: 0.3rem 0.8rem;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--stone);
    transition: all 0.15s;
  }
  .tab-btn.active { background: var(--ink); color: white; }
  .tab-btn:hover:not(.active) { background: var(--warm-mid); }

  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* Questions */
  .questions-list { list-style: none; }
  .question-item {
    display: flex;
    gap: 0.75rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid #f0ece4;
    align-items: flex-start;
  }
  .question-item:last-child { border-bottom: none; }
  .q-num {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--gold);
    width: 20px;
    margin-top: 2px;
  }
  .q-text {
    font-family: 'EB Garamond', serif;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--ink);
    flex: 1;
  }

  /* Passajes */
  .verses-box {
    background: var(--parchment);
    border-left: 3px solid var(--gold);
    border-radius: 0 4px 4px 0;
    padding: 0.75rem 1rem;
    margin-top: 0.5rem;
  }
  .verses-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.4rem;
  }
  .verses-list {
    font-family: 'EB Garamond', serif;
    font-size: 0.95rem;
    color: var(--stone);
    line-height: 1.7;
  }

  /* Reflexiones grupales */
  .reflections-area { }
  .reflection-entry {
    background: var(--parchment);
    border: 1px solid var(--warm-mid);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
    margin-bottom: 0.75rem;
    position: relative;
  }
  .reflection-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
  }
  .reflection-author {
    font-size: 12px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.04em;
  }
  .reflection-date {
    font-size: 11px;
    color: var(--stone);
  }
  .reflection-text {
    font-family: 'EB Garamond', serif;
    font-size: 1rem;
    line-height: 1.55;
    color: var(--ink);
    white-space: pre-wrap;
  }
  .reflection-question-ref {
    font-size: 10px;
    color: var(--stone);
    margin-top: 0.4rem;
    font-style: italic;
  }
  .delete-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #f5ece9;
    border: 1px solid #e8c5bb;
    cursor: pointer;
    color: var(--ember);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    transition: all 0.18s;
    letter-spacing: 0.03em;
    line-height: 1.4;
  }
  .delete-btn:hover {
    background: var(--ember);
    color: white;
    border-color: var(--ember);
  }

  .add-reflection {
    background: white;
    border: 1.5px dashed var(--warm-mid);
    border-radius: var(--radius);
    padding: 1rem;
    margin-top: 0.5rem;
  }
  .add-reflection label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 0.3rem;
    margin-top: 0.6rem;
  }
  .add-reflection label:first-child { margin-top: 0; }
  .add-reflection input,
  .add-reflection select,
  .add-reflection textarea {
    width: 100%;
    padding: 0.5rem 0.65rem;
    border: 1.5px solid var(--warm-mid);
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    background: var(--parchment);
    outline: none;
    transition: border-color 0.15s;
    resize: vertical;
  }
  .add-reflection input:focus,
  .add-reflection select:focus,
  .add-reflection textarea:focus {
    border-color: var(--gold);
  }
  .add-reflection textarea { min-height: 80px; }
  .btn-add {
    margin-top: 0.75rem;
    padding: 0.5rem 1.2rem;
    background: var(--ink);
    color: var(--parchment);
    border: none;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-add:hover { background: #2e2820; }

  /* Mark complete */
  .complete-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding-top: 1rem;
    border-top: 1px solid var(--warm-mid);
    margin-top: 0.5rem;
  }
  .btn-complete {
    padding: 0.45rem 1rem;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
    border: 1.5px solid var(--leaf);
    color: var(--leaf);
    background: transparent;
  }
  .btn-complete:hover { background: var(--leaf); color: white; }
  .btn-complete.undo { border-color: var(--stone); color: var(--stone); }
  .btn-complete.undo:hover { background: var(--stone); color: white; }
  .complete-hint { font-size: 11px; color: var(--stone); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--stone);
  }
  .empty-state .icon { font-size: 2rem; margin-bottom: 0.5rem; }
  .empty-state p { font-size: 13px; line-height: 1.5; }

  /* Footer */
  footer {
    text-align: center;
    padding: 2rem 1rem;
    font-size: 11px;
    color: var(--stone);
    border-top: 1px solid var(--warm-mid);
    margin-top: 1rem;
  }

  /* ── USER BAR ── */
  #user-bar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.5rem;
    padding: 0.5rem 1.5rem;
    background: var(--ink);
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  .bar-username { font-size: 12px; color: var(--gold-light); font-weight: 600; margin-right: 0.25rem; }
  .bar-btn {
    font-size: 11px; font-weight: 600; padding: 0.3rem 0.75rem;
    border-radius: 4px; border: 1px solid rgba(255,255,255,0.2);
    background: transparent; color: rgba(247,243,236,0.7);
    cursor: pointer; transition: all 0.15s;
  }
  .bar-btn:hover { background: rgba(255,255,255,0.1); color: white; }
  .admin-btn { border-color: var(--gold-light); color: var(--gold-light); }
  .admin-btn:hover { background: var(--gold-light); color: var(--ink); }

  /* ── AUTH MODAL ── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 1rem;
  }
  .modal-box {
    background: var(--parchment); border-radius: 10px;
    padding: 2rem 1.75rem; width: 100%; max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-logo { font-size: 2rem; text-align: center; margin-bottom: 0.5rem; }
  .modal-title { font-family: 'EB Garamond', serif; font-size: 1.4rem; font-weight: 600; text-align: center; color: var(--ink); margin-bottom: 0.2rem; }
  .modal-sub { font-family: 'EB Garamond', serif; font-style: italic; font-size: 0.9rem; color: var(--stone); text-align: center; margin-bottom: 1.25rem; }
  .auth-tabs { display: flex; border-bottom: 2px solid var(--warm-mid); margin-bottom: 1.25rem; }
  .auth-tab { flex: 1; padding: 0.5rem; border: none; background: transparent; font-size: 13px; font-weight: 600; color: var(--stone); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
  .auth-tab.active { color: var(--ink); border-bottom-color: var(--ink); }
  .auth-pane { display: none; }
  .auth-pane.active { display: block; }
  .auth-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--stone); margin-bottom: 0.3rem; margin-top: 0.75rem; }
  .auth-input { width: 100%; padding: 0.55rem 0.75rem; border: 1.5px solid var(--warm-mid); border-radius: 4px; font-size: 14px; font-family: 'Inter', sans-serif; background: white; color: var(--ink); outline: none; transition: border-color 0.15s; }
  .auth-input:focus { border-color: var(--gold); }
  .auth-error { font-size: 12px; color: var(--ember); margin-top: 0.4rem; min-height: 1rem; }
  .auth-btn { width: 100%; margin-top: 1rem; padding: 0.65rem; background: var(--ink); color: var(--parchment); border: none; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .auth-btn:hover { background: #2e2820; }
  .admin-user-row { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid var(--warm-mid); gap: 0.5rem; flex-wrap: wrap; }
  .admin-uname { font-size: 13px; font-weight: 600; color: var(--ink); min-width: 80px; }

    @media (max-width: 480px) {
    main { padding: 0.75rem; }
    .chapter-header { padding: 0.85rem 0.9rem; }
    .chapter-body { padding: 0 0.9rem 1rem; }
    nav { padding: 0.5rem 0.75rem; }
  }
</style>
</head>

// ── SESSION ───────────────────────────────────────────────────────────────────
let currentUser = null;

function hashPass(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (Math.imul(31, h) + str.charCodeAt(i)) | 0; }
  return h.toString(16);
}

function loadSession() {
  try {
    const s = sessionStorage.getItem('hv_session');
    if (s) currentUser = JSON.parse(s);
  } catch {}
}

function saveSession(user) {
  currentUser = user;
  sessionStorage.setItem('hv_session', JSON.stringify(user));
}

function clearSession() {
  currentUser = null;
  sessionStorage.removeItem('hv_session');
}

function isAdmin() {
  return currentUser && currentUser.isAdmin;
}

// ── USER MANAGEMENT ───────────────────────────────────────────────────────────
let usersCache = {};

function startUsersListener() {
  db.ref(USERS_ROOT).on('value', snap => {
    usersCache = snap.val() || {};
    if (document.getElementById('admin-panel')) renderAdminPanel();
  });
}

async function registerUser(username, password) {
  const key = username.toLowerCase().trim();
  if (usersCache[key]) return { ok: false, msg: 'Ese nombre ya está registrado.' };
  await db.ref(USERS_ROOT + '/' + key).set({ username, passHash: hashPass(password) });
  return { ok: true };
}

function loginUser(username, password) {
  if (username.trim() === 'Administrador' && password === ADMIN_PASS) {
    return { ok: true, user: { username: 'Administrador', isAdmin: true } };
  }
  const key = username.toLowerCase().trim();
  const record = usersCache[key];
  if (!record) return { ok: false, msg: 'Usuario no encontrado.' };
  if (record.passHash !== hashPass(password)) return { ok: false, msg: 'Clave incorrecta.' };
  return { ok: true, user: { username: record.username, isAdmin: false } };
}

async function resetUserPassword(username, newPassword) {
  const key = username.toLowerCase().trim();
  if (!usersCache[key]) return { ok: false, msg: 'Usuario no encontrado.' };
  await db.ref(USERS_ROOT + '/' + key + '/passHash').set(hashPass(newPassword));
  return { ok: true };
}

async function deleteUser(username) {
  await db.ref(USERS_ROOT + '/' + username.toLowerCase().trim()).remove();
}

// ── STATE ────────────────────────────────────────────────────────────────────
let state = {};

function getChapterState(id) {
  if (!state[id]) state[id] = { completed: false, reflections: [] };
  return state[id];
}

function saveChapterCompleted(chapterId, value) {
  db.ref(ROOT + '/' + chapterId + '/completed').set(value);
}

function saveReflection(chapterId, reflection) {
  db.ref(ROOT + '/' + chapterId + '/reflections/' + reflection.id).set(reflection);
}

function deleteReflection(chapterId, reflectionId) {
  db.ref(ROOT + '/' + chapterId + '/reflections/' + reflectionId).remove();
}

function startListening() {
  db.ref(ROOT).on('value', snapshot => {
    const data = snapshot.val() || {};
    state = {};
    for (const chId in data) {
      const ch = data[chId];
      const reflObj = ch.reflections || {};
      state[chId] = {
        completed: ch.completed || false,
        reflections: Object.values(reflObj)
      };
    }
    renderAll();
    hideLoading();
  });
}

          <button id="reg-btn" class="auth-btn">Crear cuenta</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);

  document.getElementById('tab-login').addEventListener('click', () => switchAuthTab('login'));
  document.getElementById('tab-register').addEventListener('click', () => switchAuthTab('register'));

  document.getElementById('login-btn').addEventListener('click', () => {
    const u = document.getElementById('login-user').value.trim();
    const p = document.getElementById('login-pass').value;
    if (!u || !p) { document.getElementById('login-error').textContent = 'Completa todos los campos.'; return; }

    saveSession(res.user);
    modal.remove();
    updateUserBar();
    renderAll();
  });

  document.getElementById('login-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });

  document.getElementById('reg-btn').addEventListener('click', async () => {
    const u = document.getElementById('reg-user').value.trim();
    const p = document.getElementById('reg-pass').value;
    const p2 = document.getElementById('reg-pass2').value;
    const errEl = document.getElementById('reg-error');
    if (!u || !p) { errEl.textContent = 'Completa todos los campos.'; return; }
    if (p !== p2) { errEl.textContent = 'Las claves no coinciden.'; return; }
    if (p.length < 4) { errEl.textContent = 'La clave debe tener al menos 4 caracteres.'; return; }
    if (u.toLowerCase() === 'administrador') { errEl.textContent = 'Ese nombre no est\u00e1 disponible.'; return; }
    errEl.textContent = 'Registrando\u2026';
    const res = await registerUser(u, p);
    if (!res.ok) { errEl.textContent = res.msg; return; }
    const loginRes = loginUser(u, p);
    saveSession(loginRes.user);
    modal.remove();
    updateUserBar();
    renderAll();
  });
}

function switchAuthTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('pane-login').classList.toggle('active', tab === 'login');

}

function updateUserBar() {
  const bar = document.getElementById('user-bar');

  if (!currentUser) {
    bar.innerHTML = '<button id="btn-login-bar" class="bar-btn">Iniciar sesi\u00f3n</button>';

      clearSession(); updateUserBar(); renderAll();

    if (isAdmin()) {
      document.getElementById('btn-admin').addEventListener('click', showAdminPanel);

}

      const row = btn.closest('.admin-user-row');

      await deleteUser(uname);
    });
  });

// ── RENDER ───────────────────────────────────────────────────────────────────
let currentFilter = 'all';
let openChapters = new Set();
let activeTab = {};

function renderAll() {
  const container = document.getElementById('chapters-container');
  const filtered = CHAPTERS.filter(ch => {
    const s = getChapterState(ch.id);
    if (currentFilter === 'done') return s.completed;
    if (currentFilter === 'pending') return !s.completed;
    return true;
  });
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">\u{1F4D6}</div><p>No hay cap\u00edtulos en esta categor\u00eda a\u00fan.</p></div>';
    updateProgress();
    return;
  }
  container.innerHTML = filtered.map(ch => renderChapter(ch)).join('');
  updateProgress();
  updateNav();
  attachEvents();
}

function renderChapter(ch) {
  const s = getChapterState(ch.id);
  const isOpen = openChapters.has(ch.id);
  const tab = activeTab[ch.id] || 'preguntas';
  const reflCount = s.reflections.length;
  return (
    '<div class="chapter-card ' + (s.completed ? 'completed' : '') + ' ' + (isOpen ? 'open' : '') + '" data-id="' + ch.id + '">' +
    '<div class="chapter-header" data-toggle="' + ch.id + '">' +
    '<div class="ch-num">' + ch.num + '</div>' +
    '<div class="ch-info">' +
    '<div class="ch-tag">' + ch.tag + '</div>' +
    '<div class="ch-title">' + ch.title + '</div>' +
    (ch.subtitle ? '<div class="ch-sub">' + ch.subtitle + '</div>' : '') +
    '<div class="ch-author">' + ch.author + '</div>' +
    '</div>' +
    '<div class="ch-toggle">' +
    '<span class="ch-status-badge">' + (s.completed ? '\u2713 Listo' : (reflCount > 0 ? reflCount + ' reflexi\u00f3n' + (reflCount>1?'es':'') : 'Pendiente')) + '</span>' +
    '<span class="ch-arrow">\u25be</span>' +
    '</div></div>' +
    '<div class="chapter-body">' +
    '<div class="tab-row">' +
    '<button class="tab-btn ' + (tab==='preguntas'?'active':'') + '" data-tab="preguntas" data-cid="' + ch.id + '">Preguntas</button>' +
    '<button class="tab-btn ' + (tab==='reflexiones'?'active':'') + '" data-tab="reflexiones" data-cid="' + ch.id + '">Reflexiones' + (reflCount>0?' ('+reflCount+')':'') + '</button>' +
    '<button class="tab-btn ' + (tab==='pasajes'?'active':'') + '" data-tab="pasajes" data-cid="' + ch.id + '">Pasajes</button>' +
    '</div>' +
    '<div class="tab-pane ' + (tab==='preguntas'?'active':'') + '" data-cid="' + ch.id + '">' +
    '<ul class="questions-list">' +
    ch.questions.map((q,i) => '<li class="question-item"><span class="q-num">'+(i+1)+'.</span><span class="q-text">'+q+'</span></li>').join('') +
    '</ul></div>' +
    '<div class="tab-pane ' + (tab==='reflexiones'?'active':'') + '" data-cid="' + ch.id + '">' +
    '<div class="reflections-area" id="refl-list-' + ch.id + '">' + renderReflections(ch) + '</div>' +
    renderAddForm(ch) +
    '</div>' +
    '<div class="tab-pane ' + (tab==='pasajes'?'active':'') + '" data-cid="' + ch.id + '">' +
    '<div class="verses-box"><div class="verses-label">Pasajes para profundizar</div><div class="verses-list">' + ch.verses + '</div></div>' +
    '</div>' +
    '<div class="complete-row">' +
    '<button class="btn-complete ' + (s.completed?'undo':'') + '" data-complete="' + ch.id + '">' +
    (s.completed ? 'Marcar como pendiente' : '\u2713 Marcar como completado') +
    '</button>' +
    '<span class="complete-hint">' + (s.completed ? 'Este cap\u00edtulo est\u00e1 marcado como discutido.' : 'M\u00e1rcalo cuando el grupo haya discutido este cap\u00edtulo.') + '</span>' +
    '</div></div></div>'
  );
}

function renderReflections(ch) {
  const s = getChapterState(ch.id);
  if (!s.reflections || s.reflections.length === 0) {
    return '<div class="empty-state" style="padding:1.2rem 0"><div class="icon">\u270d\ufe0f</div><p>A\u00fan no hay reflexiones. \u00a1S\u00e9 el primero en compartir!</p></div>';
  }
  return s.reflections.map(r => {
    const canDelete = currentUser && (isAdmin() || currentUser.username === r.author);
    return (
      '<div class="reflection-entry" data-rid="' + r.id + '" data-cid="' + ch.id + '">' +
      '<div class="reflection-meta">' +
      '<span class="reflection-author">' + escHtml(r.author) + '</span>' +
      '<span class="reflection-date">' + r.date + '</span>' +
      '</div>' +
      '<div class="reflection-text">' + escHtml(r.text) + '</div>' +
      (r.questionIdx !== undefined && r.questionIdx !== null && r.questionIdx !== '' ?
        '<div class="reflection-question-ref">En respuesta a la pregunta ' + (parseInt(r.questionIdx)+1) + ': "' + (ch.questions[r.questionIdx] || '').substring(0,60) + '\u2026"</div>' : '') +
      (canDelete ? '<button class="delete-btn" data-delete="' + r.id + '" data-cid="' + ch.id + '" title="Eliminar reflexi\u00f3n">Eliminar</button>' : '') +
      '</div>'
    );
  }).join('');
}

function renderAddForm(ch) {
  if (!currentUser) {
    return '<div class="add-reflection" style="text-align:center;padding:1.2rem">' +
      '<p style="font-size:13px;color:#6b6258;margin-bottom:0.75rem">Inicia sesi\u00f3n para agregar una reflexi\u00f3n.</p>' +
      '<button class="btn-add btn-login-inline">Iniciar sesi\u00f3n</button></div>';
  }
  return (
    '<div class="add-reflection">' +
    '<p style="font-size:12px;color:#8b6914;margin-bottom:0.75rem">Agregando como <strong>' + escHtml(currentUser.username) + '</strong></p>' +
    '<label>Pregunta de reflexi\u00f3n (opcional)</label>' +
    '<select id="qsel-' + ch.id + '">' +
    '<option value="">\u2014 Reflexi\u00f3n general sobre el cap\u00edtulo \u2014</option>' +
    ch.questions.map((q,i) => '<option value="'+i+'">'+(i+1)+'. '+q.substring(0,60)+'\u2026</option>').join('') +
    '</select>' +
    '<label>Reflexi\u00f3n</label>' +
    '<textarea id="text-' + ch.id + '" placeholder="Escribe aqu\u00ed tu reflexi\u00f3n\u2026"></textarea>' +
    '<button class="btn-add" data-save="' + ch.id + '">Guardar reflexi\u00f3n</button>' +
    '</div>'
  );
}

function updateProgress() {
  const total = CHAPTERS.length;
  const done = CHAPTERS.filter(ch => getChapterState(ch.id).completed).length;
  document.getElementById('progress-label').textContent = done + ' / ' + total;
  document.getElementById('progress-bar').style.width = ((done/total)*100) + '%';
}

function updateNav() {
  document.querySelectorAll('.nav-pill').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === currentFilter);
  });
}

// ── EVENTS ───────────────────────────────────────────────────────────────────
function attachEvents() {
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.toggle;
      if (openChapters.has(id)) openChapters.delete(id);
      else openChapters.add(id);
      renderAll();
      setTimeout(() => {
        const card = document.querySelector('[data-id="' + id + '"]');
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 50);
    });
  });

  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      activeTab[btn.dataset.cid] = btn.dataset.tab;
      renderAll();
    });
  });

  document.querySelectorAll('.btn-login-inline').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); showAuthModal(); });
  });

  document.querySelectorAll('[data-save]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!currentUser) { showAuthModal(); return; }
      const id = btn.dataset.save;
      const text = document.getElementById('text-' + id).value.trim();
      const qIdx = document.getElementById('qsel-' + id).value;
      if (!text) { alert('Por favor escribe una reflexi\u00f3n.'); return; }
      const now = new Date();
      const dateStr = now.toLocaleDateString('es', {day:'2-digit', month:'short', year:'numeric'});
      saveReflection(id, {
        id: Date.now().toString(),
        author: currentUser.username,
        text, date: dateStr,
        questionIdx: qIdx !== '' ? parseInt(qIdx) : null
      });
      activeTab[id] = 'reflexiones';
      document.getElementById('text-' + id).value = '';
      document.getElementById('qsel-' + id).value = '';
    });
  });

  document.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (!currentUser) return;
      if (!confirm('\u00bfEliminar esta reflexi\u00f3n?')) return;
      deleteReflection(btn.dataset.cid, btn.dataset.delete);
    });
  });

  document.querySelectorAll('[data-complete]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (!currentUser) { showAuthModal(); return; }
      const id = btn.dataset.complete;
      saveChapterCompleted(id, !getChapterState(id).completed);
    });
  });
}

document.querySelectorAll('.nav-pill').forEach(btn => {
  btn.addEventListener('click', () => { currentFilter = btn.dataset.filter; renderAll(); });
});

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function hideLoading() {
  const el = document.getElementById('loading-screen');
  if (el) el.remove();
}

// ── EXPORT PDF ───────────────────────────────────────────────────────────────
function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginL = 18;
  const marginR = 18;
  const contentW = pageW - marginL - marginR;
  let y = 0;

  function checkPage(needed) {
    if (y + needed > pageH - 18) { doc.addPage(); y = 20; }
  }

  function wrapText(text, x, startY, maxW, lineH, fontSize) {
    doc.setFontSize(fontSize);
    const lines = doc.splitTextToSize(text, maxW);
    lines.forEach(line => {
      checkPage(lineH);
      doc.text(line, x, startY + (y - startY));
      y += lineH;
    });
    return y;
  }

  // ── COVER PAGE ──
  doc.setFillColor(26, 22, 18);
  doc.rect(0, 0, pageW, pageH, 'F');

  doc.setTextColor(201, 151, 42);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'bold');
  doc.text('GRUPO DE LECTURA Y ORACIÓN', pageW / 2, 70, { align: 'center' });

  doc.setTextColor(247, 243, 236);
  doc.setFontSize(28);
  doc.setFont('helvetica', 'bold');
  doc.text('Hombre Verdadero', pageW / 2, 95, { align: 'center' });

  doc.setTextColor(180, 160, 120);
  doc.setFontSize(13);
  doc.setFont('helvetica', 'italic');
  doc.text('Nathan Busenitz — editor general', pageW / 2, 108, { align: 'center' });

  doc.setTextColor(100, 90, 80);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'normal');
  const now = new Date();
  doc.text('Exportado el ' + now.toLocaleDateString('es', {day:'2-digit', month:'long', year:'numeric'}), pageW / 2, 175, { align: 'center' });

  // Count stats
  let totalRefls = 0;
  let completedCount = 0;
  CHAPTERS.forEach(ch => {
    const s = getChapterState(ch.id);
    if (s.completed) completedCount++;
    totalRefls += s.reflections.length;
  });
  doc.setTextColor(140, 105, 20);
  doc.setFontSize(10);
  doc.text(completedCount + ' de ' + CHAPTERS.length + ' capítulos completados  ·  ' + totalRefls + ' reflexiones registradas', pageW / 2, 185, { align: 'center' });

  // ── CHAPTERS ──
  CHAPTERS.forEach(ch => {
    const s = getChapterState(ch.id);
    if (!s.reflections || s.reflections.length === 0) return;

    doc.addPage();
    y = 20;

    // Chapter header bar
    doc.setFillColor(26, 22, 18);
    doc.rect(0, 0, pageW, 14, 'F');
    doc.setTextColor(201, 151, 42);
    doc.setFontSize(8);
    doc.setFont('helvetica', 'bold');
    doc.text(ch.tag.toUpperCase(), marginL, 9);
    doc.setTextColor(180, 160, 120);
    doc.text(s.completed ? '✓ Completado' : 'Pendiente', pageW - marginR, 9, { align: 'right' });

    y = 24;

    // Chapter title
    doc.setTextColor(26, 22, 18);
    doc.setFontSize(16);
    doc.setFont('helvetica', 'bold');
    const titleLines = doc.splitTextToSize(ch.title, contentW);
    titleLines.forEach(line => { doc.text(line, marginL, y); y += 7; });

    if (ch.subtitle) {
      doc.setFontSize(11);
      doc.setFont('helvetica', 'italic');
      doc.setTextColor(107, 98, 88);
      const subLines = doc.splitTextToSize(ch.subtitle, contentW);
      subLines.forEach(line => { doc.text(line, marginL, y); y += 5.5; });
    }

    doc.setFontSize(9);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(139, 105, 20);
    doc.text(ch.author, marginL, y);
    y += 8;

    // Divider
    doc.setDrawColor(201, 151, 42);
    doc.setLineWidth(0.4);
    doc.line(marginL, y, pageW - marginR, y);
    y += 7;

    // Reflections
    s.reflections.forEach((r, idx) => {
      checkPage(20);

      // Reflection header
      doc.setFillColor(247, 243, 236);
      doc.roundedRect(marginL, y - 4, contentW, 8, 1, 1, 'F');
      doc.setFontSize(9);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(26, 22, 18);
      doc.text(r.author, marginL + 3, y + 1);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(107, 98, 88);
      doc.text(r.date, pageW - marginR - 3, y + 1, { align: 'right' });
      y += 7;

      // Question ref
      if (r.questionIdx !== undefined && r.questionIdx !== null) {
        const qText = ch.questions[r.questionIdx] || '';
        checkPage(8);
        doc.setFontSize(8);
        doc.setFont('helvetica', 'italic');
        doc.setTextColor(139, 105, 20);
        const qRef = 'Pregunta ' + (parseInt(r.questionIdx) + 1) + ': ' + qText.substring(0, 70) + (qText.length > 70 ? '…' : '');
        const qLines = doc.splitTextToSize(qRef, contentW - 4);
        qLines.forEach(line => { checkPage(5); doc.text(line, marginL + 3, y); y += 4.5; });
        y += 1;
      }

      // Reflection text
      doc.setFontSize(10);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(26, 22, 18);
      const textLines = doc.splitTextToSize(r.text, contentW - 4);
      textLines.forEach(line => { checkPage(6); doc.text(line, marginL + 3, y); y += 5.5; });
      y += 6;

      // Separator between reflections
      if (idx < s.reflections.length - 1) {
        checkPage(4);
        doc.setDrawColor(220, 214, 200);
        doc.setLineWidth(0.2);
        doc.line(marginL + 10, y - 3, pageW - marginR - 10, y - 3);
      }
    });
  });

  // Page numbers
  const totalPages = doc.internal.getNumberOfPages();
  for (let i = 2; i <= totalPages; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(160, 150, 140);
    doc.setFont('helvetica', 'normal');
    doc.text('Hombre Verdadero  ·  ' + i + ' / ' + totalPages, pageW / 2, pageH - 8, { align: 'center' });
  }

  doc.save('hombre-verdadero-reflexiones.pdf');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadSession();
startUsersListener();
startListening();
updateUserBar();
</script>
